name: Build SLB English APK
on:
  push:
    branches: [slbandroid]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        run: |
          python3 content/build_data.py
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/release/app-release.apk SLBEnglish6S.apk
          gh release create "slb-android-${{ github.run_number }}" SLBEnglish6S.apk --target slbandroid \
            --title "陕旅英语六上 Android ${{ github.run_number }}" --notes "Android APK"
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          touch build.log
          { echo '```'; grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | head -80; echo '```'; } > err.md
          gh issue create --title "SLB Android build failed: run ${{ github.run_number }}" --body-file err.md
