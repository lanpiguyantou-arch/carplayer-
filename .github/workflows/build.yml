name: Build CarPlayer IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project CarPlayer.xcodeproj -target CarPlayer -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CarPlayer.app Payload/
          zip -qry CarPlayer-unsigned.ipa Payload

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" CarPlayer-unsigned.ipa CarPlayer.entitlements CarPlayer-video.entitlements \
            --title "CarPlayer build ${{ github.run_number }}" \
            --notes "Unsigned IPA. Sign with your own certificate before installing."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          { echo '```'; grep -E "error:|BUILD FAILED" build.log | head -60 || true; echo '---'; tail -40 build.log || true; echo '```'; } > err.md
          gh issue create --title "Build failed: run ${{ github.run_number }}" --body-file err.md
