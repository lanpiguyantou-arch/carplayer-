name: Build Yuwen 6S
on:
  push:
    branches: [yuwen]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        run: |
          python3 content/build_data.py
          mkdir -p app/src/main/assets && cp -R www app/src/main/assets/www
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/release/app-release.apk Yuwen6S.apk
          gh release create "yuwen-android-${{ github.run_number }}" Yuwen6S.apk --target yuwen \
            --title "六上语文 Android ${{ github.run_number }}" --notes "Android APK"
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          touch build.log
          { echo '```'; grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | head -80; echo '```'; } > err.md
          gh issue create --title "Yuwen Android build failed: run ${{ github.run_number }}" --body-file err.md
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Data
        run: |
          python3 content/build_data.py
          cp -R www ios/Sources/www
      - name: Build
        run: |
          brew install xcodegen
          set -o pipefail
          cd ios
          xcodegen generate
          xcodebuild -project Yuwen6S.xcodeproj -target Yuwen6S -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../build.log
      - name: Package and publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p Payload
          cp -R ios/build/Release-iphoneos/Yuwen6S.app Payload/
          ls Payload/Yuwen6S.app/www
          zip -qry Yuwen6S-unsigned.ipa Payload
          gh release create "yuwen-ios-${{ github.run_number }}" Yuwen6S-unsigned.ipa --target yuwen \
            --title "六上语文 iOS ${{ github.run_number }}" --notes "Unsigned IPA. Sign before installing."
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          touch build.log
          { echo '```'; grep -E "error:|BUILD FAILED" build.log | head -60 || true; echo '```'; } > err.md
          gh issue create --title "Yuwen iOS build failed: run ${{ github.run_number }}" --body-file err.md
